<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D063A"/>
      <stop offset="45%" stop-color="#4A0E4E"/>
      <stop offset="85%" stop-color="#1E0226"/>
      <stop offset="100%" stop-color="#120117"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="berryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" fill="url(#bannerBg)"/>

  <!-- Decorative curved waves -->
  <path d="M0,180 Q200,120 400,170 T800,140 L800,240 L0,240 Z" fill="#3B0744" opacity="0.4"/>
  <path d="M0,200 Q240,160 500,210 T800,180 L800,240 L0,240 Z" fill="#25032C" opacity="0.6"/>

  <!-- Floating açaí berries in background -->
  <circle cx="80" cy="50" r="14" fill="#3B0764" opacity="0.6"/>
  <circle cx="95" cy="65" r="10" fill="#581C87" opacity="0.7"/>
  <circle cx="700" cy="40" r="16" fill="#3B0764" opacity="0.5"/>
  <circle cx="730" cy="60" r="12" fill="#581C87" opacity="0.6"/>
  <circle cx="760" cy="35" r="9" fill="#6B21A8" opacity="0.4"/>

  <!-- Left graphic: Tropical leaves & fresh fruits -->
  <g transform="translate(40, 40)">
    <!-- Tropical leaf -->
    <path d="M30,120 C20,70 60,30 110,20 C100,50 80,90 30,120 Z" fill="#15803D" opacity="0.7"/>
    <path d="M10,130 C15,85 45,55 90,45 C80,75 55,105 10,130 Z" fill="#22C55E" opacity="0.5"/>
    
    <!-- Strawberry graphic -->
    <g transform="translate(75, 80) scale(0.9)">
      <path d="M20,10 C35,10 40,25 35,45 C30,58 20,68 20,68 C20,68 10,58 5,45 C0,25 5,10 20,10 Z" fill="#DC2626"/>
      <!-- Seeds -->
      <circle cx="15" cy="25" r="1.5" fill="#FEF08A"/>
      <circle cx="25" cy="28" r="1.5" fill="#FEF08A"/>
      <circle cx="20" cy="40" r="1.5" fill="#FEF08A"/>
      <circle cx="12" cy="42" r="1.5" fill="#FEF08A"/>
      <circle cx="27" cy="45" r="1.5" fill="#FEF08A"/>
      <circle cx="18" cy="54" r="1.2" fill="#FEF08A"/>
      <!-- Leaf top -->
      <path d="M14,12 C10,5 5,8 8,14 C12,12 18,12 20,10 C22,12 28,12 32,14 C35,8 30,5 26,12 Z" fill="#16A34A"/>
    </g>

    <!-- Banana slice -->
    <g transform="translate(115, 105) scale(0.85)">
      <circle cx="20" cy="20" r="18" fill="#FEF08A" stroke="#FDE047" stroke-width="2"/>
      <circle cx="20" cy="20" r="12" fill="#FFFBEB"/>
      <circle cx="20" cy="20" r="3" fill="#CA8A04"/>
    </g>
  </g>

  <!-- Center Text / Title Banner -->
  <g transform="translate(400, 110)" text-anchor="middle">
    <!-- Super Açaí Badge -->
    <rect x="-110" y="-80" width="220" height="28" rx="14" fill="url(#redGrad)"/>
    <text x="0" y="-62" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="2">★ SABOR DO AÇAÍ ★</text>
    
    <!-- Title -->
    <text x="0" y="-15" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="1">O AÇAÍ MAIS CREMOSO</text>
    
    <!-- Subtitle -->
    <text x="0" y="16" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">PAGUE 1 E LEVE 2 • 9 COMPLEMENTOS GRÁTIS</text>
    <text x="0" y="38" fill="#E9D5FF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Entrega rápida, geladinha e embalagem lacrada</text>
  </g>

  <!-- Right side graphic: Stylized Açaí cup silhouette and toppings -->
  <g transform="translate(630, 45)">
    <!-- Glow -->
    <circle cx="65" cy="75" r="60" fill="#9333EA" opacity="0.25" filter="url(#glow)"/>

    <!-- Cup body -->
    <path d="M35,60 L95,60 L85,150 L45,150 Z" fill="#3B0764" stroke="#A855F7" stroke-width="2"/>
    <path d="M42,65 L88,65 L80,145 L50,145 Z" fill="#2E1065"/>
    
    <!-- Açaí swirl overflow -->
    <path d="M30,62 Q65,30 100,62 Q90,50 65,48 Q40,50 30,62 Z" fill="#581C87"/>
    <ellipse cx="65" cy="55" rx="32" ry="12" fill="#6B21A8"/>
    <circle cx="65" cy="44" r="10" fill="#7E22CE"/>

    <!-- Strawberry topping -->
    <g transform="translate(68, 30) scale(0.6)">
      <path d="M20,10 C35,10 40,25 35,45 C30,58 20,68 20,68 C20,68 10,58 5,45 C0,25 5,10 20,10 Z" fill="#EF4444"/>
      <path d="M14,12 C10,5 5,8 8,14 C12,12 18,12 20,10 C22,12 28,12 32,14 C35,8 30,5 26,12 Z" fill="#22C55E"/>
    </g>

    <!-- Banana topping -->
    <g transform="translate(42, 38) scale(0.55)">
      <circle cx="20" cy="20" r="18" fill="#FEF08A" stroke="#FDE047" stroke-width="2"/>
      <circle cx="20" cy="20" r="3" fill="#CA8A04"/>
    </g>

    <!-- Powdered milk swirl / condensed milk drip -->
    <path d="M48,68 Q52,90 50,105 Q48,110 52,110 Q56,110 54,95 Q56,80 58,68 Z" fill="#FEF3C7" opacity="0.9"/>
    
    <!-- Promo badge on cup -->
    <circle cx="95" cy="115" r="22" fill="url(#redGrad)"/>
    <text x="95" y="112" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">2x1</text>
    <text x="95" y="125" fill="#FEF08A" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">COMBO</text>
  </g>
</svg>
