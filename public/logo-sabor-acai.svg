<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A044E"/>
      <stop offset="50%" stop-color="#2E0854"/>
      <stop offset="100%" stop-color="#1E0226"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="acaiCream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701A75"/>
      <stop offset="50%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="150" cy="150" r="145" fill="url(#logoBg)"/>
  
  <!-- Outer gold accent border -->
  <circle cx="150" cy="150" r="140" fill="none" stroke="url(#goldRing)" stroke-width="4"/>
  <circle cx="150" cy="150" r="133" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4"/>

  <!-- Top arc text "DELIVERY OFICIAL" -->
  <path id="curveTop" d="M 50 150 A 100 100 0 0 1 250 150" fill="none"/>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#FDE047" letter-spacing="3.5">
    <textPath href="#curveTop" startOffset="50%" text-anchor="middle">
      DELIVERY OFICIAL
    </textPath>
  </text>

  <!-- Açai Bowl Graphic in Center -->
  <g transform="translate(150, 142)" filter="url(#logoShadow)">
    <!-- Bowl Body -->
    <path d="M -55,-5 C -55,45 55,45 55,-5 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="3"/>
    
    <!-- Açai Surface / Cream -->
    <ellipse cx="0" cy="-5" rx="54" ry="18" fill="url(#acaiCream)"/>
    <ellipse cx="0" cy="-7" rx="46" ry="14" fill="#6B21A8"/>
    <ellipse cx="0" cy="-9" rx="38" ry="10" fill="#86198F"/>

    <!-- Strawberry on bowl -->
    <g transform="translate(-18, -25) scale(0.65)">
      <path d="M20,10 C35,10 40,25 35,45 C30,58 20,68 20,68 C20,68 10,58 5,45 C0,25 5,10 20,10 Z" fill="#DC2626"/>
      <circle cx="16" cy="28" r="1.8" fill="#FEF08A"/>
      <circle cx="26" cy="32" r="1.8" fill="#FEF08A"/>
      <circle cx="20" cy="46" r="1.8" fill="#FEF08A"/>
      <path d="M14,12 C10,5 5,8 8,14 C12,12 18,12 20,10 C22,12 28,12 32,14 C35,8 30,5 26,12 Z" fill="#16A34A"/>
    </g>

    <!-- Banana slice -->
    <g transform="translate(6, -24) scale(0.6)">
      <circle cx="20" cy="20" r="18" fill="#FEF08A" stroke="#FDE047" stroke-width="2"/>
      <circle cx="20" cy="20" r="12" fill="#FFFBEB"/>
      <circle cx="20" cy="20" r="3" fill="#CA8A04"/>
    </g>

    <!-- Granola sprinkles -->
    <circle cx="-32" cy="-8" r="2.5" fill="#D97706"/>
    <circle cx="-25" cy="-12" r="2" fill="#B45309"/>
    <circle cx="-38" cy="-5" r="2" fill="#F59E0B"/>
    <circle cx="28" cy="-10" r="2.5" fill="#D97706"/>
    <circle cx="34" cy="-6" r="2" fill="#B45309"/>
    <circle cx="22" cy="-6" r="1.8" fill="#F59E0B"/>

    <!-- Condensed milk swirl -->
    <path d="M -30,-4 Q -10,6 15,-4 Q 30,-2 40,-8" fill="none" stroke="#FEF3C7" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <!-- "Sabor Do" -->
  <text x="150" y="210" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="3">
    SABOR DO
  </text>
  <!-- "AÇAÍ" in big bold font with gold/white glow -->
  <text x="150" y="242" fill="#FDE047" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="2">
    AÇAÍ
  </text>
  <!-- 5 stars underneath -->
  <g transform="translate(110, 256)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#F59E0B">★★★★★</text>
  </g>
</svg>
